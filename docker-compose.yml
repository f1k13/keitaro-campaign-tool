# START_MODULE_CONTRACT
#   PURPOSE: Local stack: PostgreSQL + FastAPI backend + React frontend (nginx).
#   SCOPE: Service wiring, ports, healthchecks.
#   DEPENDS: M-BACKEND-API, M-FRONTEND-APP
#   LINKS: M-INFRA, V-M-INFRA
# END_MODULE_CONTRACT
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keitaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keitaro}
      POSTGRES_DB: ${POSTGRES_DB:-keitaro}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./apps/backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-keitaro}:${POSTGRES_PASSWORD:-keitaro}@db:5432/${POSTGRES_DB:-keitaro}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./apps/frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
